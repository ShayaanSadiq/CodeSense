server:
  port: ${PORT:8090}

spring:
  application:
    name: codesense-prototype-api
  jackson:
    default-property-inclusion: non_null
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/codesense}
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen3:8b}
          temperature: 0.2

codesense:
  data-dir: ${CODESENSE_DATA:data}
  ollama-base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
  ollama-model: ${OLLAMA_MODEL:qwen3:8b}
  openai-api-key: ${OPENAI_API_KEY:}
  openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  gemini-api-key: ${GEMINI_API_KEY:}
  groq-api-key: ${GROQ_API_KEY:}
  llm-model: ${LLM_MODEL:}
